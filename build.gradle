plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"settingspresets" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// In-game tests (./gradlew runClientGameTest): drive the real client, load presets, take screenshots.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "settingspresets-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
}

// Unit tests target the Minecraft-free classes in the client source set.
sourceSets {
	test {
		compileClasspath += sourceSets.client.output + sourceSets.main.output
		runtimeClasspath += sourceSets.client.output + sourceSets.main.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: Mod Menu integration. Not bundled, not required at runtime.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Pass -PnoModMenu to run the dev client / game tests without Mod Menu.
	if (!project.hasProperty("noModMenu")) {
		localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.google.code.gson:gson:2.13.1'
}

test {
	useJUnitPlatform()
}

tasks.named("processClientResources") {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
